<title>Marquee Braun Edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ============================================================ chrome tokens */
:root{
  --c-bg:#F1F0EC; --c-panel:#FFFFFF; --c-fg:#1A1B1D; --c-muted:#76766F;
  --c-rule:#D8D6D0; --c-sig:#DE5F10; --c-soft:#E7E6E1; --c-shadow:rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#121214; --c-panel:#1B1B1E; --c-fg:#EDECE7; --c-muted:#8B8B85;
    --c-rule:#2E2E33; --c-sig:#F26A16; --c-soft:#232327; --c-shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --c-bg:#121214; --c-panel:#1B1B1E; --c-fg:#EDECE7; --c-muted:#8B8B85;
  --c-rule:#2E2E33; --c-sig:#F26A16; --c-soft:#232327; --c-shadow:rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--c-bg); color:var(--c-fg);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:2100px;margin:0 auto;padding:28px 28px 64px}

/* ============================================================ page chrome */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--c-rule);margin-bottom:22px}
.head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.20em;text-transform:uppercase}
.head p{margin:6px 0 0;font-size:14px;color:var(--c-muted);max-width:64ch;line-height:1.55}
.switches{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{display:flex;border:1px solid var(--c-rule);background:var(--c-panel)}
.sw button{appearance:none;border:0;background:transparent;color:var(--c-muted);cursor:pointer;
  font:600 11px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:10px 14px}
.sw button+button{border-left:1px solid var(--c-rule)}
.sw button[aria-pressed="true"]{background:var(--c-fg);color:var(--c-bg)}
.sw button:focus-visible{outline:2px solid var(--c-sig);outline-offset:-2px}

.layout{display:grid;grid-template-columns:196px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;border-top:1px solid var(--c-rule)}
.rail button{appearance:none;background:transparent;border:0;border-bottom:1px solid var(--c-rule);
  cursor:pointer;text-align:left;padding:13px 4px 13px 14px;color:var(--c-muted);
  font:500 13px/1 Archivo,sans-serif;letter-spacing:.10em;text-transform:uppercase;
  display:flex;justify-content:space-between;gap:8px;align-items:center}
.rail button:hover{color:var(--c-fg)}
.rail button:focus-visible{outline:2px solid var(--c-sig);outline-offset:-2px}
.rail button[aria-current="true"]{color:var(--c-fg);box-shadow:inset 4px 0 0 var(--c-sig)}
.rail .n{font-family:"Roboto Mono",monospace;font-size:11px;opacity:.55}

.stage{min-width:0}
.frame{position:relative;width:100%;overflow:hidden;background:#000;box-shadow:0 2px 26px var(--c-shadow)}
.note{margin-top:16px;border-top:1px solid var(--c-rule);padding-top:14px;
  display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px}
.note h2{margin:0;font:600 11px/1.5 Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--c-muted)}
.note ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.65;max-width:78ch}
.note li+li{margin-top:5px}

/* ============================================================ artboard */
.tv{width:1920px;height:1080px;transform-origin:top left;position:relative;overflow:hidden;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink)}
.tv[data-tv="white"]{
  --paper:#E7E6E1; --panel:#F8F7F4; --panel2:#EFEEE9; --sunk:#DEDCD5;
  --ink:#1A1B1D; --ink2:#75756E; --ink3:#A3A29B;
  --rule:#CBC9C2; --rule2:#DCDAD3;
  --signal:#DE5F10; --onsig:#FFFFFF; --inv:#1A1B1D; --oninv:#F8F7F4;
}
.tv[data-tv="black"], .tv .finish-black{
  --paper:#141416; --panel:#1D1D20; --panel2:#232327; --sunk:#0E0E10;
  --ink:#EFEEE9; --ink2:#8C8C86; --ink3:#65655F;
  --rule:#33333A; --rule2:#28282E;
  --signal:#F26A16; --onsig:#141416; --inv:#EFEEE9; --oninv:#141416;
}
.screen{position:absolute;inset:0}

/* shared type */
.lab{font:600 13px/1 Archivo,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:var(--ink2)}
.lab-s{font:600 11px/1 Archivo,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* top rail */
.rail-tv{position:absolute;left:0;right:0;top:0;height:104px;display:flex;align-items:center;
  padding:0 80px;gap:56px;border-bottom:1px solid var(--rule);background:var(--panel)}
.mark{font:600 27px/1 Archivo,sans-serif;letter-spacing:.30em;color:var(--ink)}
.tabs{display:flex;gap:38px;align-items:center;margin-left:auto;margin-right:auto}
.tab{font:500 16px/1 Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);
  padding-bottom:9px;border-bottom:3px solid transparent}
.tab.sel{color:var(--ink);border-bottom-color:var(--signal)}
.rail-r{display:flex;align-items:center;gap:22px;color:var(--ink2)}
.gear{width:26px;height:26px;border:2px solid currentColor;border-radius:50%;position:relative}
.gear::after{content:"";position:absolute;inset:6px;border:2px solid currentColor;border-radius:50%}
.clock{font:500 15px/1 "Roboto Mono",monospace;letter-spacing:.06em}

.page{position:absolute;left:0;right:0;top:104px;bottom:0;padding:0 80px}

/* artwork */
.art{position:relative;overflow:hidden;width:100%;height:100%;display:block}
.art-t{position:absolute;left:11px;top:11px;right:11px;font:600 11px/1.3 Archivo,sans-serif;
  letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.plate{border:1px solid var(--rule);background:var(--sunk);overflow:hidden}

/* rows */
.rowhead{display:flex;align-items:baseline;gap:16px;padding:0 0 10px}
.rowhead .ct{font:500 12px/1 "Roboto Mono",monospace;color:var(--ink3)}
.rowhead .ln{flex:1;height:1px;background:var(--rule2)}
.strip{display:flex;gap:26px;overflow:hidden}
.card{width:156px;flex:0 0 156px}
.card .th{width:100%;height:234px;position:relative;border:1px solid var(--rule)}
.card .cap{margin-top:11px}
.card .cap .t{font:500 15px/1.25 Archivo,sans-serif;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cap .s{margin-top:3px;font:400 13px/1 "Roboto Mono",monospace;color:var(--ink3)}
.card .fbar{height:6px;background:transparent;margin-top:9px}
.prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.42)}
.prog i{display:block;height:100%;background:var(--signal)}

/* focus */
.tv[data-focus="on"] .fx .th{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.tv[data-focus="on"] .fx .fbar{background:var(--signal)}
.tv[data-focus="on"] .fx .cap .t{font-weight:600}
.tv[data-focus="on"] .fx-row{background:var(--panel2);box-shadow:inset 5px 0 0 var(--signal)}
.tv[data-focus="on"] .fx-btn{background:var(--inv);color:var(--oninv);border-color:var(--inv)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:62px;padding:0 30px;
  border:1px solid var(--ink);color:var(--ink);background:transparent;
  font:600 16px/1 Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.btn.pri{background:var(--signal);border-color:var(--signal);color:var(--onsig)}
.btn.wide{width:100%}
.tri{width:0;height:0;border-left:12px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}

/* spec grid */
.spec{display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.spec>div{flex:1;padding:16px 0 15px;border-right:1px solid var(--rule2)}
.spec>div:last-child{border-right:0}
.spec .k{font:600 11px/1 Archivo,sans-serif;letter-spacing:.20em;text-transform:uppercase;color:var(--ink3)}
.spec .v{margin-top:9px;font:500 22px/1 Archivo,sans-serif;color:var(--ink)}
.spec .v.m{font-family:"Roboto Mono",monospace;font-size:20px}

/* chips */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);color:var(--ink2);padding:8px 15px;
  font:500 13px/1 Archivo,sans-serif;letter-spacing:.10em;text-transform:uppercase}

/* control list */
.ctl{border-top:1px solid var(--rule)}
.ctl .r{display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:17px 16px;border-bottom:1px solid var(--rule2)}
.ctl .r .k{font:500 16px/1 Archivo,sans-serif;letter-spacing:.06em;color:var(--ink)}
.ctl .r .v{font:400 15px/1 "Roboto Mono",monospace;color:var(--ink2)}
.ctl .r .v.on{color:var(--signal);font-weight:500}

.body-copy{font:400 20px/1.62 Archivo,sans-serif;color:var(--ink2);max-width:62ch}
.h-xl{font:500 84px/1 Archivo,sans-serif;letter-spacing:-.018em;color:var(--ink)}
.h-lg{font:500 58px/1.04 Archivo,sans-serif;letter-spacing:-.012em;color:var(--ink)}
.h-md{font:500 34px/1.1 Archivo,sans-serif;color:var(--ink)}

/* dial ticks */
.dial{display:flex;align-items:flex-end;gap:9px;height:22px}
.dial i{width:2px;height:11px;background:var(--ink3)}
.dial i.on{height:22px;width:3px;background:var(--signal)}

/* live guide */
.guide{display:grid;grid-template-columns:250px repeat(5,1fr);border-top:1px solid var(--rule)}
.guide>div{border-bottom:1px solid var(--rule2);border-right:1px solid var(--rule2);
  padding:14px 16px;height:92px;overflow:hidden}
.gh{height:50px !important;padding:0 16px !important;display:flex;align-items:center;
  font:600 12px/1 Archivo,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.gch{display:flex;flex-direction:column;justify-content:center;gap:6px;background:var(--panel2)}
.gch .n{font:600 17px/1 Archivo,sans-serif;letter-spacing:.14em;color:var(--ink)}
.gch .d{font:400 12px/1 "Roboto Mono",monospace;color:var(--ink3)}
.gp{display:flex;flex-direction:column;justify-content:center;gap:7px}
.gp .t{font:500 16px/1.2 Archivo,sans-serif;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp .m{font:400 12px/1 "Roboto Mono",monospace;color:var(--ink3)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--signal)}

/* keyboard */
.kb{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.kb span{border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2);
  height:72px;display:flex;align-items:center;justify-content:center;
  font:500 22px/1 Archivo,sans-serif;color:var(--ink2)}

/* episode list */
.ep{display:flex;align-items:center;gap:22px;padding:15px 16px;border-bottom:1px solid var(--rule2)}
.ep .no{font:500 17px/1 "Roboto Mono",monospace;color:var(--ink3);width:34px;flex:0 0 34px}
.ep .st{width:132px;height:74px;border:1px solid var(--rule);flex:0 0 132px;position:relative}
.ep .tx{flex:1;min-width:0}
.ep .tx .t{font:500 20px/1.2 Archivo,sans-serif;color:var(--ink)}
.ep .tx .d{margin-top:6px;font:400 14px/1.4 Archivo,sans-serif;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep .rt{font:400 15px/1 "Roboto Mono",monospace;color:var(--ink3)}

/* player transport */
.scrub{position:relative;height:6px;background:var(--rule)}
.scrub .buf{position:absolute;left:0;top:0;bottom:0;background:var(--ink3)}
.scrub .pl{position:absolute;left:0;top:0;bottom:0;background:var(--signal)}
.scrub .hd{position:absolute;top:-9px;width:4px;height:24px;background:var(--signal)}
.scrub .ck{position:absolute;top:-5px;width:1px;height:16px;background:var(--ink3)}

/* system board */
.sw-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.swatch{border:1px solid var(--rule)}
.swatch .b{height:92px}
.swatch .m{padding:10px 12px;background:var(--panel)}
.swatch .m .k{font:600 11px/1 Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.swatch .m .h{margin-top:6px;font:400 13px/1 "Roboto Mono",monospace;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="head">
    <div>
      <h1>Marquee &mdash; Braun Edition</h1>
      <p>Nine screens of the Apple TV app rebuilt on Rams' principles: hairlines instead of boxes, artwork never washed with a gradient, and one orange signal that only ever means &ldquo;where you are, or what happens next.&rdquo;</p>
    </div>
    <div class="switches">
      <div class="sw" role="group" aria-label="Product finish">
        <button id="tw" aria-pressed="true">White</button>
        <button id="tb" aria-pressed="false">Black</button>
      </div>
      <div class="sw" role="group" aria-label="Focus state">
        <button id="fo" aria-pressed="false">Show focus</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Screens"></nav>
    <div class="stage">
      <div class="frame" id="frame"><div class="tv" id="tv" data-tv="white" data-focus="off"></div></div>
      <div class="note"><h2 id="noteTitle">Notes</h2><ul id="noteBody"></ul></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- artwork */
var FIELDS=[["#4A5A63","#28323A"],["#6A5C4A","#3B3227"],["#4B4E64","#2C2E44"],
            ["#5A5348","#35322B"],["#3F5450","#22302C"],["#63514C","#3A2E2C"],
            ["#4E5A4A","#2F3830"],["#54506A","#322E46"],["#5F5B53","#38352F"],
            ["#455565","#26313C"]];
function hash(s){var x=0,i;for(i=0;i<s.length;i++){x=(x*31+s.charCodeAt(i))>>>0;}return x;}
function art(title,bare){
  var n=hash(title),f=FIELDS[n%FIELDS.length],v=(n>>4)%4,sh="";
  if(v===0)sh='<i style="position:absolute;right:-6%;top:8%;width:52%;aspect-ratio:1;border-radius:50%;background:'+f[1]+'"></i>';
  if(v===1)sh='<i style="position:absolute;left:0;bottom:0;width:100%;height:34%;background:'+f[1]+'"></i>';
  if(v===2)sh='<i style="position:absolute;left:16%;top:0;width:28%;height:100%;background:'+f[1]+'"></i>';
  if(v===3)sh='<i style="position:absolute;inset:0;background:linear-gradient(202deg,transparent 48%,'+f[1]+' 48%)"></i>';
  var t=bare?"":'<span class="art-t">'+title+'</span>';
  return '<div class="art" style="background:'+f[0]+'">'+sh+t+'</div>';
}
// A credits block: name left, part right, on a hairline. The back page of a
// Braun manual, not a row of cropped faces.
function credits(list){
  var h="",i;
  for(i=0;i<list.length;i++)
    h+='<div style="display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule2)">'+
       '<span style="font:500 16px/1 Archivo;color:var(--ink)">'+list[i][0]+'</span>'+
       '<span style="font:400 15px/1 Archivo;color:var(--ink3)">'+list[i][1]+'</span></div>';
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 48px;border-top:1px solid var(--rule)">'+h+'</div>';
}

/* ---------------------------------------------------------------- content */
var MOVIES=[["Blade Runner 2049",2017],["Interstellar",2014],["Dune",2021],["Arrival",2016],
 ["The Thing",1982],["Heat",1995],["Chinatown",1974],["No Country for Old Men",2007],
 ["Prisoners",2013],["Sicario",2015],["Zodiac",2007],["Children of Men",2006],
 ["Ex Machina",2014],["Annihilation",2018],["Moon",2009],["Solaris",1972],["Alien",1979],
 ["Gattaca",1997],["The Insider",1999],["Tinker Tailor Soldier Spy",2011]];

function railHTML(items,cur){
  var h="",i;
  for(i=0;i<items.length;i++){
    h+='<button data-s="'+items[i][0]+'"'+(items[i][0]===cur?' aria-current="true"':'')+'>'+
       items[i][1]+'<span class="n">'+("0"+(i+1)).slice(-2)+'</span></button>';
  }
  return h;
}
function tabs(cur){
  var t=["Home","Movies","TV","Live","Library","Collections"],h="",i;
  for(i=0;i<t.length;i++)h+='<span class="tab'+(t[i]===cur?" sel":"")+'">'+t[i]+'</span>';
  return '<div class="rail-tv"><span class="mark">MARQUEE</span><div class="tabs">'+h+
         '</div><div class="rail-r"><span class="clock">9:41</span><span class="gear"></span></div></div>';
}
function card(title,year,opt){
  opt=opt||{};
  var p=opt.progress?'<div class="prog"><i style="width:'+Math.round(opt.progress*100)+'%"></i></div>':"";
  return '<div class="card'+(opt.focus?" fx":"")+'"><div class="th">'+art(title)+p+
         '</div><div class="cap"><div class="t">'+title+'</div><div class="s">'+year+'</div></div>'+
         '<div class="fbar"></div></div>';
}
function row(label,count,cards){
  return '<div style="margin-bottom:34px"><div class="rowhead"><span class="lab">'+label+
   '</span><span class="ln"></span><span class="ct">'+count+'</span></div>'+
   '<div class="strip">'+cards+'</div></div>';
}

/* ---------------------------------------------------------------- screens */
var S={};

S.home=function(f){
  var cw="",i;
  var cont=[["Blade Runner 2049",2017,.62],["Severance",2022,.31],["Heat",1995,.88],
            ["Dune",2021,.14],["Arrival",2016,.47],["Zodiac",2007,.71],["Alien",1979,.09],
            ["Moon",2009,.55],["Fargo",2014,.22],["Chinatown",1974,.4]];
  for(i=0;i<cont.length;i++)cw+=card(cont[i][0],cont[i][1],{progress:cont[i][2],focus:f&&i===0});
  var ra="";for(i=0;i<10;i++)ra+=card(MOVIES[i+4][0],MOVIES[i+4][1],{});
  return tabs("Home")+'<div class="page" style="padding-top:26px">'+
  '<div style="display:flex;gap:44px;align-items:flex-start">'+
    '<div class="plate" style="width:1076px;height:398px;flex:0 0 1076px">'+art("Blade Runner 2049")+'</div>'+
    '<div style="flex:1;min-width:0;padding-top:4px">'+
      '<div class="lab-s">The Marquee &mdash; this week</div>'+
      '<div class="h-lg" style="margin-top:18px">Blade Runner<br>2049</div>'+
      '<div class="mono" style="margin-top:18px;font-size:15px;color:var(--ink3);letter-spacing:.08em">2017 &nbsp;/&nbsp; 2H 44M &nbsp;/&nbsp; 4K HDR &nbsp;/&nbsp; 8.0</div>'+
      '<div style="margin-top:26px;display:flex;gap:14px">'+
        '<div class="btn pri'+(f?" fx-btn":"")+'"><span class="tri"></span>Play</div>'+
        '<div class="btn">Details</div>'+
      '</div>'+
      '<div class="dial" style="margin-top:34px"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>'+
    '</div>'+
  '</div>'+
  '<div style="margin-top:38px">'+
    row("Continue watching","10",cw)+
    row("Recently added","24",ra)+
  '</div></div>';
};

S.movie=function(f){
  return tabs("Movies")+'<div class="page" style="padding-top:24px">'+
  '<div class="plate" style="height:348px">'+art("Interstellar")+'</div>'+
  '<div style="display:flex;gap:72px;margin-top:30px">'+
    '<div style="flex:1;min-width:0">'+
      '<div class="h-xl">Interstellar</div>'+
      '<div class="spec" style="margin-top:24px">'+
        '<div><div class="k">Year</div><div class="v m">2014</div></div>'+
        '<div><div class="k">Rating</div><div class="v m">8.4</div></div>'+
        '<div><div class="k">Runtime</div><div class="v m">2:49:00</div></div>'+
        '<div><div class="k">Video</div><div class="v">4K HDR</div></div>'+
        '<div><div class="k">Audio</div><div class="v">5.1 EAC3</div></div>'+
        '<div><div class="k">Size</div><div class="v m">48.2 GB</div></div>'+
      '</div>'+
      '<div class="chips" style="margin-top:22px"><span class="chip">Adventure</span><span class="chip">Drama</span><span class="chip">Science Fiction</span></div>'+
      '<div class="body-copy" style="margin-top:24px">A failing Earth sends a former pilot through a wormhole to find somewhere the rest of us can live. He leaves his daughter behind, and the trip costs him her whole childhood.</div>'+
      '<div class="lab" style="margin-top:26px;display:block">Cast</div>'+
      '<div style="margin-top:12px">'+credits([
        ["Matthew McConaughey","Cooper"],["Anne Hathaway","Brand"],
        ["Jessica Chastain","Murph"],["Michael Caine","Professor Brand"],
        ["Mackenzie Foy","Murph, young"],["Casey Affleck","Tom"]])+'</div>'+

/* ---------------------------------------------------------------- notes */
var NOTES={
 home:["The Marquee art plate is never scrimmed and carries no type. Title, meta and Play sit beside it on the panel, so the artwork stays artwork.",
  "Six ticks replace the dot carousel. It reads as a dial position rather than decoration.",
  "Rows are labelled in caps with a hairline running out to the count on the right, so a row reads as a drawer with a quantity in it, not a banner.",
  "The second row is deliberately cut by the bottom edge. That is the scroll affordance."],
 movie:["Actions become a labelled column instead of a horizontal strip that scrolls off. Every control is on screen at once and one press of Down away.",
  "Six spec cells carry what you actually decide on: year, rating, runtime, video, audio, size.",
  "Resume is the orange one. Play from start sits directly under it, always visible, never buried in a menu.",
  "The filename stays, in mono, because it is a machine fact and should look like one."],
 show:["Season selection is a row of cells with a signal underline. No picker, no popover.",
  "Episodes are a list, not a carousel: number, still, title, one line, runtime. Partly-watched episodes carry the orange rule on the still.",
  "The focused row takes a panel tint and a signal edge on the left, legible at a glance from the couch."],
 library:["The A to Z rail is a real index, and the current letter is the only orange on the screen.",
  "Eight across at 1920 gives a 190px poster, still legible at three metres, and three full rows before the fold.",
  "Titles always sit under the poster, never over it."],
 live:["The guide is a timetable, which is the thing Braun drew best. Hairlines only, no coloured blocks.",
  "The vertical signal line is now. It is the only orange in the grid, so where you are is never ambiguous.",
  "The plate up top shows how far into the current programme you would be joining."],
 search:["The keyboard is a fixed six-column grid rather than the tvOS ribbon, so letters stay where your thumb learned them.",
  "The caret is the signal. The query sits on a two-pixel ink rule, like a form field that has been filled in.",
  "Results are a grid, not a row, because search results have no natural order to scroll along."],
 player:["The player always takes the black finish, in either theme. A white control panel across the bottom of a film is the one place the light system genuinely fails.",
  "The transport is a solid panel with a hairline top edge, not a gradient fade. It either covers the picture or it does not.",
  "Chapter marks are ticks on the scrubber. The playhead is a bar, not a knob.",
  "Elapsed left, remaining right, engine readout between them, so you can see whether you are direct playing or transcoding without opening anything.",
  "Skip intro is a normal button in the control row rather than a floating overlay."],
 settings:["Sections left, rows right, label left and value right on a hairline. A spec sheet.",
  "Values that are actively on read orange. Everything else is grey, so a screen of settings shows what is switched on at a glance.",
  "The footer strip is the server status the old About page buried."],
 system:["Orange has exactly one meaning: where you are, or what happens next. Focus, progress, now, the primary action. Nothing else may use it.",
  "The black finish is the same system inverted, for night. Both ship and both are switchable, because a white screen in a dark room is punishing.",
  "Two faces only. Archivo for anything a person reads, Roboto Mono for anything a machine produced."]
};

name: Apple TV preview shots

# Renders the REAL app in the tvOS Simulator on a cloud Mac and screenshots each
# tab — a true preview that does NOT ship to TestFlight. Runs on every push to
# appletv/ (review before shipping), plus a manual button.
# Needs secret MARQUEE_PREVIEW_TMDB (sample data from TMDB's public CDN).
on:
  push:
    paths:
      - 'appletv/**'
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-15
    defaults:
      run:
        working-directory: appletv
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for tvOS Simulator
        run: |
          xcodebuild \
            -project MarqueeTV.xcodeproj \
            -scheme MarqueeTV \
            -sdk appletvsimulator \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot simulator, install, screenshot each tab
        env:
          BUNDLE: com.scenicprints.marqueetv
        run: |
          set -x
          DEV=$(xcrun simctl list devices available | grep -m1 "Apple TV" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$DEV" ]; then
            RT=$(xcrun simctl list runtimes | grep -m1 tvOS | sed -E 's/.* - (com[^ ]*) .*/\1/')
            DEV=$(xcrun simctl create "Preview ATV" "Apple TV 4K (3rd generation)" "$RT")
          fi
          echo "device=$DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APP=$(find build/dd/Build/Products -name "MarqueeTV.app" -type d | head -1)
          echo "app=$APP"
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          # One screenshot with retries. The sim resprings on the FIRST
          # terminate+relaunch after install, so whichever tab is captured
          # second used to deterministically photograph the tvOS boot screen.
          # Real app frames (mock posters everywhere) are >300 KB; the boot
          # screen is ~175 KB — retry small shots with a fresh relaunch.
          snap() { # $1 = output name, $2 = env var name, $3 = env var value
            for A in 1 2 3; do
              env "SIMCTL_CHILD_PREVIEW_TMDB=${{ secrets.MARQUEE_PREVIEW_TMDB }}" \
                  "SIMCTL_CHILD_$2=$3" \
                  xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE"
              sleep 24
              xcrun simctl io "$DEV" screenshot "shots/$1.png" || true
              SZ=$(stat -f%z "shots/$1.png" 2>/dev/null || echo 0)
              [ "$SZ" -ge 300000 ] && break
              echo "shot $1 looks like the boot screen ($SZ bytes) — retrying"
            done
          }
          for T in home movies tv livetv library search collections settings; do
            # --terminate-running-process guarantees a clean relaunch that
            # re-reads PREVIEW_TAB (a plain launch just foregrounds the old
            # process, leaving it on the previous tab). Mock mode pulls sample
            # titles + real posters from TMDB's public CDN, so previews work
            # even when the media server is offline.
            snap "$T" PREVIEW_TAB "$T"
          done
          # The show-detail (seasons) screen, reached via PREVIEW_ROUTE.
          snap showdetail PREVIEW_ROUTE show
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: preview-shots
          path: appletv/shots/*.png
          if-no-files-found: warn

      # A real-sized library, and a budget for building a page against it.
      #
      # Build 72 froze on the owner's Apple TV: the row pool re-parsed each
      # title's genres inside every row filter and compiled a regex per title,
      # which came to about a second of main-thread work per render against
      # 1,600 films — and a render happens on every press of the remote. Every
      # check above this one passed, because they all run against the two dozen
      # sample titles the preview loads. A cost that scales with the library
      # cannot be caught by a library of twenty.
      #
      # So: launch the real app with PREVIEW_BULK titles, read the ROWCOST line
      # the app logs on each rebuild, and fail on the budget.
      - name: Row build cost at library scale
        env:
          BUNDLE: com.scenicprints.marqueetv
          BULK: '2000'
          BUDGET_MS: '250'
        run: |
          set -eo pipefail
          DEV=$(xcrun simctl list devices booted | grep -m1 "Apple TV" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          [ -n "$DEV" ] || { echo "no booted simulator"; exit 1; }
          SINCE=$(date -u '+%Y-%m-%d %H:%M:%S')
          env "SIMCTL_CHILD_PREVIEW_TMDB=${{ secrets.MARQUEE_PREVIEW_TMDB }}" \
              "SIMCTL_CHILD_PREVIEW_TAB=home" \
              "SIMCTL_CHILD_PREVIEW_BULK=$BULK" \
              xcrun simctl launch --terminate-running-process "$DEV" "$BUNDLE"
          sleep 40
          # Match on the message, not on who logged it: NSLog attributes
          # senderImagePath to the logging library rather than the app binary,
          # which is how the first version of this step found nothing at all.
          LOG="xcrun simctl spawn $DEV log show --style compact --start"
          $LOG "$SINCE" --predicate 'eventMessage CONTAINS "ROWCOST"' > rowcost.log 2>/dev/null || true
          grep -o 'ROWCOST[^"]*' rowcost.log | sort -u | tee rowcost.txt || true
          if [ ! -s rowcost.txt ]; then
            echo "::error::no ROWCOST line - the app never built a page, so this check proved nothing"
            $LOG "$SINCE" --predicate 'process == "MarqueeTV"' 2>/dev/null | tail -60 || true
            exit 1
          fi
          ITEMS=$(sed -E 's/.*items=([0-9]+).*/\1/' rowcost.txt | sort -rn | head -1)
          if [ "${ITEMS:-0}" -lt 1000 ]; then
            echo "::error::only $ITEMS titles reached the rows — PREVIEW_BULK did not take, so the budget below is meaningless"
            exit 1
          fi
          WORST=$(sed -E 's/.*ms=([0-9]+).*/\1/' rowcost.txt | sort -rn | head -1)
          echo "worst page build: ${WORST}ms across ${ITEMS} titles (budget ${BUDGET_MS}ms)"
          if [ "$WORST" -gt "$BUDGET_MS" ]; then
            echo "::error::building a page took ${WORST}ms for ${ITEMS} titles, over the ${BUDGET_MS}ms budget."
            echo "Something in the row pool is doing per-title work that should be paid once — see the note at the top of BrowseRows.swift."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rowcost
          path: appletv/rowcost.*
          if-no-files-found: ignore

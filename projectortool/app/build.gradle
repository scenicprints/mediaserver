plugins { id 'com.android.application' }

android {
    namespace 'com.scenicprints.projectortool'
    compileSdk 34

    defaultConfig {
        applicationId 'com.scenicprints.projectortool'
        // The VAVA projector is Android 7.1 (API 25).
        minSdk 21
        targetSdk 28
        versionCode (project.hasProperty('appVersionCode') ? project.appVersionCode.toInteger() : 1)
        versionName '1.0'
    }

    // Fixed keystore (generated and committed by CI on first run) so every build
    // shares one signing key. Without it each CI runner invents a fresh debug key
    // and the next version refuses to install over the last one — which is
    // exactly what bit the first sideload.
    signingConfigs {
        release {
            def ks = rootProject.file('keystore/tool.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword 'projector'
                keyAlias 'projector'
                keyPassword 'projector'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (rootProject.file('keystore/tool.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider: Android 7 rejects a file:// uri handed to the package installer.
    implementation 'androidx.core:core:1.12.0'
}
